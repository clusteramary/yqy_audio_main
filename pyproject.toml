[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-robot"
version = "0.1.0"
description = "Offline research toolkit for multimodal interview robots"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
learning = ["torch>=1.12"]

[project.scripts]
interview-robot = "interview_robot.cli:main"

[tool.setuptools.packages.find]
include = ["interview_robot*"]
